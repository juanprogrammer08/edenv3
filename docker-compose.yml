services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: producto
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studio}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studio -d producto']
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: ./api
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?Declara AUTH_SECRET en el entorno de Dokploy}
      DATABASE_URL: postgresql+psycopg://studio:studio@db:5432/producto
    depends_on:
      db: {condition: service_healthy}
  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    ports: ['8080:80']
    depends_on: [api]
volumes:
  pgdata: {}
